<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'" />
<style>
@font-face { font-family: "Inter"; src: url(fonts/inter.woff2) format("woff2"); font-weight: 100 900; }
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 500 13px "Inter", "Segoe UI", sans-serif;
  color: #f5f5f7; -webkit-font-smoothing: antialiased; user-select: none; }
.card { position: absolute; left: 8px; right: 8px; top: 8px; bottom: 8px; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 12px;
  border-radius: 20px; background: rgba(20, 20, 22, .92); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset 0 0 0 1px rgba(255,255,255,.08), 0 10px 30px rgba(0,0,0,.45);
  opacity: 0; transform: translateX(30px) scale(.97); }
.card.in { animation: in 520ms cubic-bezier(.32,.72,0,1) forwards, out 300ms ease-in 3700ms forwards; }
@keyframes in { from { opacity: 0; transform: translateX(30px) scale(.97); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes out { to { opacity: 0; transform: translateX(16px) scale(.98); } }
.orb { --c: #8a8f98; position: relative; flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 650; font-size: 17px; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.5);
  background: radial-gradient(120% 90% at 50% 105%, #000 28%, color-mix(in oklab, var(--c) 85%, #ff6a00 15%) 46%, color-mix(in oklab, var(--c) 40%, #9fb4ff) 62%, color-mix(in oklab, var(--c) 30%, #1a2140) 82%), #1a2140;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.35), inset 0 6px 12px rgba(255,255,255,.18); }
.dot { position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; background: #32d74b; box-shadow: 0 0 0 3px rgba(20,20,22,.95); }
.txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.txt b { font-weight: 650; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.txt span { color: #a1a1a6; font-size: 12.5px; }
.mark { width: 18px; height: 18px; opacity: .8; flex: none; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<radialGradient id="orbG" cx="50%" cy="82%" r="80%"><stop offset="0" stop-color="#07060a"/><stop offset=".30" stop-color="#0b0912"/><stop offset=".40" stop-color="#ff8a3d"/><stop offset=".47" stop-color="#ffd2a6"/><stop offset=".55" stop-color="#9fb7d9"/><stop offset=".66" stop-color="#5d7fc4"/><stop offset=".80" stop-color="#2c3766"/><stop offset="1" stop-color="#151a33"/></radialGradient>
      <linearGradient id="orbH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <linearGradient id="orbR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".5" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity=".45"/></linearGradient>
      <clipPath id="orbC"><circle cx="50" cy="50" r="33"/></clipPath>
      <symbol id="logo" viewBox="16 16 68 68"><circle cx="50" cy="50" r="33" fill="url(#orbG)"/><g clip-path="url(#orbC)"><ellipse cx="50" cy="26" rx="22" ry="11" fill="url(#orbH)" opacity=".55"/></g><circle cx="50" cy="50" r="32.6" fill="none" stroke="url(#orbR)" stroke-width=".8"/></symbol>
</defs></svg>
<div class="card" id="card">
  <div class="orb" id="orb"><span id="ini"></span><i class="dot"></i></div>
  <div class="txt"><b id="nm"></b><span id="tx"></span></div>
  <svg class="mark"><use href="#logo"/></svg>
</div>
<script>
window.showNotify = function (d) {
  var c = document.getElementById('card');
  document.getElementById('orb').style.setProperty('--c', d.color || '#8a8f98');
  document.getElementById('ini').textContent = (String(d.name || '?').trim()[0] || '?').toUpperCase();
  document.getElementById('nm').textContent = d.name || '';
  document.getElementById('tx').textContent = d.text || '';
  c.classList.remove('in'); void c.offsetWidth; c.classList.add('in');
};
</script>
</body>
</html>
