<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src ws: wss: https: http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'" />
  <title>TriMeet</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Ícones -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-screen" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="13" rx="2.5"/><path d="M8 21h8M12 17v4"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="13" rx="2.5"/><path d="M12 13.5V8M9.5 10.5 12 8l2.5 2.5M8 21h8"/></symbol>
      <symbol id="i-window" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18M6.5 6.5h.01M9 6.5h.01"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
      <symbol id="i-leave" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-vol" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m16 9 6 6M22 9l-6 6"/></symbol>
      <symbol id="i-expand" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></symbol>
      <symbol id="i-shrink" viewBox="0 0 24 24"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></symbol>
      <symbol id="i-full" viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19.5 7"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-host" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 16.2a6 6 0 0 0 0-8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 19.1a10 10 0 0 0 0-14.2"/></symbol>
      <symbol id="i-join" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
      <symbol id="i-res" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M7 9v6M7 12h3M10 9v6M14 9v6h2a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-2z"/></symbol>
      <symbol id="i-fps" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M10 2h4"/></symbol>
      <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M12 14l4-5"/><path d="M3.5 18a9.5 9.5 0 1 1 17 0"/></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></symbol>
      <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 7V5h16v2M9 19h6M12 5v14"/></symbol>
      <symbol id="i-chip" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></symbol>
      <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
      <symbol id="i-door" viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h8"/><path d="M14 3l5 2v14l-5 2V3z"/><path d="M11 12h.01"/></symbol>
      <symbol id="i-dice" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8h.01M16 8h.01M12 12h.01M8 16h.01M16 16h.01"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
      <radialGradient id="orbG" cx="50%" cy="82%" r="80%"><stop offset="0" stop-color="#07060a"/><stop offset=".30" stop-color="#0b0912"/><stop offset=".40" stop-color="#ff8a3d"/><stop offset=".47" stop-color="#ffd2a6"/><stop offset=".55" stop-color="#9fb7d9"/><stop offset=".66" stop-color="#5d7fc4"/><stop offset=".80" stop-color="#2c3766"/><stop offset="1" stop-color="#151a33"/></radialGradient>
      <linearGradient id="orbH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <linearGradient id="orbR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".5" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity=".45"/></linearGradient>
      <clipPath id="orbC"><circle cx="50" cy="50" r="33"/></clipPath>
      <symbol id="logo" viewBox="16 16 68 68"><circle cx="50" cy="50" r="33" fill="url(#orbG)"/><g clip-path="url(#orbC)"><ellipse cx="50" cy="26" rx="22" ry="11" fill="url(#orbH)" opacity=".55"/></g><circle cx="50" cy="50" r="32.6" fill="none" stroke="url(#orbR)" stroke-width=".8"/></symbol>
    </defs>
  </svg>
  <svg id="glassDefs" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>

  <canvas id="halftone"></canvas>

  <!-- ============ ENTRADA ============ -->
  <section id="login" class="screen">
    <div class="brand corner"><svg class="mark"><use href="#logo"/></svg>TriMeet</div>

    <div class="hero">
      <h1>Liga.<br />Compartilha.<br /><span>Pronto.</span></h1>
    </div>

    <div class="login-card glass" data-glass="28">
      <div class="me">
        <div class="orb" id="meOrb"><span id="meInitial"><svg class="ic"><use href="#i-user"/></svg></span></div>
        <label class="field name-field">
          <svg class="ic"><use href="#i-user"/></svg>
          <input id="nameInput" type="text" maxlength="20" placeholder="Digite seu nome" spellcheck="false" autocomplete="off" />
        </label>
      </div>

      <label class="field room-field">
        <svg class="ic"><use href="#i-door"/></svg>
        <input id="roomInput" type="text" maxlength="32" placeholder="Código da sala" spellcheck="false" autocomplete="off" />
        <button id="diceBtn" class="btn icon ghost" type="button" title="Gerar código"><svg class="ic"><use href="#i-dice"/></svg></button>
      </label>

      <details class="adv">
        <summary><svg class="ic"><use href="#i-gear"/></svg>Servidor</summary>
        <input id="serverInput" type="text" spellcheck="false" />
      </details>

      <button id="enterBtn" class="btn primary wide" disabled><span id="enterTxt">Entrar</span><svg class="ic"><use href="#i-arrow"/></svg></button>
      <p id="loginErr" class="err"></p>

      <div class="ver-row">
        <span id="verTxt" class="mono">v2.0</span>
        <button id="checkUpd" class="link"><svg class="ic"><use href="#i-download"/></svg><span>Atualizações</span></button>
      </div>
    </div>
  </section>

  <!-- ============ SALA ============ -->
  <section id="room" class="screen hidden">
    <header class="topbar glass" data-glass="999">
      <button id="homeBtn" class="brand home-btn" title="Voltar ao início"><svg class="mark"><use href="#logo"/></svg>TriMeet</button>
      <span class="sep"></span>
      <div id="people" class="people"></div>
      <span class="grow"></span>
      <button id="roomChip" class="room-chip" title="Copiar código da sala"><svg class="ic"><use href="#i-door"/></svg><span class="mono" id="roomName"></span><svg class="ic cp"><use href="#i-copy"/></svg></button>
      <span id="connState" class="conn" title="conectando"><i></i></span>
      <button id="updBtn" class="btn update hidden"><svg class="ic"><use href="#i-download"/></svg><span>Atualizar</span></button>
    </header>

    <main id="stage" class="stage">
      <div id="empty" class="empty">
        <div class="big-orb">
          <div class="orb-glow"></div>
          <div class="orb-content">
            <span class="spinner"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
            <span>Ninguém ao vivo</span>
          </div>
        </div>
      </div>
      <div id="focus" class="focus hidden"></div>
      <div id="grid" class="grid"></div>
    </main>

    <nav class="dock glass" data-glass="999">
      <button id="shareBtn" class="btn primary"><svg class="ic"><use href="#i-share"/></svg>Compartilhar</button>
      <button id="statsBtn" class="btn icon" title="Estatísticas"><svg class="ic"><use href="#i-chart"/></svg></button>
      <button id="leaveBtn" class="btn icon danger" title="Sair"><svg class="ic"><use href="#i-leave"/></svg></button>
    </nav>
  </section>

  <!-- ============ COMPARTILHAR ============ -->
  <div id="shareModal" class="modal hidden">
    <div class="modal-card glass" data-glass="32">
      <div class="modal-head">
        <div class="segmented" id="srcTabs">
          <span class="thumb"></span>
          <button data-tab="screen" class="on"><svg class="ic"><use href="#i-screen"/></svg>Monitores</button>
          <button data-tab="window"><svg class="ic"><use href="#i-window"/></svg>Janelas</button>
        </div>
        <button id="closeModal" class="btn icon ghost" aria-label="Fechar"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>

      <div id="sources" class="sources"></div>

      <div class="controls">
        <div class="ctl" title="Resolução">
          <svg class="ic lead"><use href="#i-res"/></svg>
          <input type="hidden" id="optRes" value="1080" />
          <div class="segmented" data-for="optRes"><span class="thumb"></span>
            <button data-v="native">Nativa</button><button data-v="1440">1440p</button><button data-v="1080">1080p</button><button data-v="720">720p</button>
          </div>
        </div>
        <div class="ctl" title="Quadros por segundo">
          <svg class="ic lead"><use href="#i-fps"/></svg>
          <input type="hidden" id="optFps" value="60" />
          <div class="segmented" data-for="optFps"><span class="thumb"></span>
            <button data-v="30">30</button><button data-v="60">60</button><button data-v="120">120</button><span class="unit">FPS</span>
          </div>
        </div>
        <div class="ctl wide" title="Qualidade (taxa de bits)">
          <svg class="ic lead"><use href="#i-gauge"/></svg>
          <input type="hidden" id="optBitrate" value="12" />
          <div class="stepper" id="bitrateStepper" data-for="optBitrate" data-steps="4,8,12,20,35">
            <div class="track"><div class="fill"></div><i></i><i></i><i></i><i></i><i></i><div class="knob"></div></div>
          </div>
          <span class="val mono" id="bitrateVal">12 Mbps</span>
        </div>
        <div class="ctl" title="Prioridade">
          <input type="hidden" id="optMode" value="motion" />
          <div class="segmented" data-for="optMode"><span class="thumb"></span>
            <button data-v="motion" title="Fluidez: melhor para jogos e vídeos"><svg class="ic"><use href="#i-bolt"/></svg>Fluidez</button>
            <button data-v="detail" title="Nitidez: melhor para texto e código"><svg class="ic"><use href="#i-text"/></svg>Nitidez</button>
          </div>
        </div>
        <div class="ctl" title="Codec de vídeo">
          <svg class="ic lead"><use href="#i-chip"/></svg>
          <input type="hidden" id="optCodec" value="H264" />
          <div class="segmented" data-for="optCodec"><span class="thumb"></span>
            <button data-v="H264" title="Usa a placa de vídeo">H.264</button><button data-v="AV1" title="RTX 40 / RX 7000 ou mais nova">AV1</button><button data-v="VP9">VP9</button>
          </div>
        </div>
        <label class="ctl wide switch-row" title="Transmitir o som do PC">
          <svg class="ic lead"><use href="#i-music"/></svg>
          <span>Som do PC</span>
          <span class="grow"></span>
          <input type="checkbox" id="optAudio" class="switch" checked />
        </label>
      </div>

      <div class="modal-foot">
        <span id="uploadHint" class="hint"><svg class="ic"><use href="#i-up"/></svg><span class="mono"></span></span>
        <span class="grow"></span>
        <button id="cancelShare" class="btn ghost">Cancelar</button>
        <button id="goShare" class="btn primary" disabled><svg class="ic"><use href="#i-share"/></svg>Transmitir</button>
      </div>
    </div>
  </div>

  <!-- ============ ATUALIZAÇÃO ============ -->
  <div id="updBanner" class="upd-banner glass hidden" data-glass="24">
    <div class="upd-ico"><svg class="ic"><use href="#i-download"/></svg></div>
    <div class="upd-txt"><b id="updTitle"></b><span id="updNotes"></span></div>
    <button id="updLater" class="btn icon ghost" title="Depois"><svg class="ic"><use href="#i-x"/></svg></button>
    <button id="updNow" class="btn update">Atualizar</button>
  </div>

  <div id="toast" class="toast glass hidden" data-glass="999"></div>

  <script src="config.js"></script>
  <script src="glass.js"></script>
  <script src="halftone.js"></script>
  <script src="app.js"></script>
</body>
</html>
