<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'" />
<title>TriMeet</title>
<style>
@font-face { font-family: "Inter"; src: url(fonts/inter.woff2) format("woff2"); font-weight: 100 900; }
html, body { margin: 0; height: 100%; background: #000; color: #f5f5f7; font: 500 13px "Inter", "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased; user-select: none; -webkit-app-region: drag; overflow: hidden; }
.wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  background: radial-gradient(70% 50% at 50% 38%, rgba(93,127,196,.18), transparent 70%); }
.orb { width: 120px; height: 120px; animation: breathe 2.4s ease-in-out infinite, rise .8s cubic-bezier(.32,.72,0,1) both;
  filter: drop-shadow(0 18px 40px rgba(255,138,61,.18)); }
.name { font-size: 20px; font-weight: 600; letter-spacing: -.02em; margin-top: -6px; animation: rise .8s .08s cubic-bezier(.32,.72,0,1) both; }
.status { color: #8e8e93; min-height: 18px; animation: rise .8s .14s cubic-bezier(.32,.72,0,1) both; }
.bar { width: 150px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; position: relative; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 3px;
  background: linear-gradient(90deg, #5d7fc4, #ffd2a6, #ff8a3d); transition: width .35s cubic-bezier(.32,.72,0,1); }
.bar.indet i { width: 40%; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { 0% { left: -40%; } 100% { left: 100%; } }
@keyframes breathe { 50% { transform: scale(1.04); } }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.97); filter: blur(6px); } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<radialGradient id="orbG" cx="50%" cy="82%" r="80%"><stop offset="0" stop-color="#07060a"/><stop offset=".30" stop-color="#0b0912"/><stop offset=".40" stop-color="#ff8a3d"/><stop offset=".47" stop-color="#ffd2a6"/><stop offset=".55" stop-color="#9fb7d9"/><stop offset=".66" stop-color="#5d7fc4"/><stop offset=".80" stop-color="#2c3766"/><stop offset="1" stop-color="#151a33"/></radialGradient>
      <linearGradient id="orbH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <linearGradient id="orbR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".5" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity=".45"/></linearGradient>
      <clipPath id="orbC"><circle cx="50" cy="50" r="33"/></clipPath>
      <symbol id="logo" viewBox="16 16 68 68"><circle cx="50" cy="50" r="33" fill="url(#orbG)"/><g clip-path="url(#orbC)"><ellipse cx="50" cy="26" rx="22" ry="11" fill="url(#orbH)" opacity=".55"/></g><circle cx="50" cy="50" r="32.6" fill="none" stroke="url(#orbR)" stroke-width=".8"/></symbol>
</defs></svg>
<div class="wrap">
  <svg class="orb"><use href="#logo"/></svg>
  <div class="name">TriMeet</div>
  <div class="bar indet" id="bar"><i></i></div>
  <div class="status" id="st">Iniciando…</div>
</div>
<script>
window.setStatus = function (text, pct) {
  document.getElementById('st').textContent = text;
  var bar = document.getElementById('bar');
  if (pct == null) { bar.classList.add('indet'); bar.firstElementChild.style.width = ''; }
  else { bar.classList.remove('indet'); bar.firstElementChild.style.width = pct + '%'; }
};
</script>
</body>
</html>
